version: 2
updates:
  # Actions are pinned to major tags here rather than commit SHAs, which is
  # readable but trusts the tag. Dependabot keeps them current; see ADR-0007
  # for when to escalate to SHA pinning.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine updates, but security fixes arrive separately so
      # they are not buried in a twelve-package bump.
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
