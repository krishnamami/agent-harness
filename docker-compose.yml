services:
  api:
    build:
      context: .
      target: runtime
    image: agent-harness:local
    ports:
      # Host port is configurable because 8000 is the most contested port
      # on any developer machine. The container port stays fixed at 8000 --
      # remapping is the host's job (ADR-0006).
      #   APP_HOST_PORT=8080 docker compose up
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_FORMAT: console
      APP_LOG_LEVEL: DEBUG
    # The service writes nothing to disk. Enforcing that here means a future
    # change that starts writing files fails locally rather than in production
    # under a hardened runtime policy.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
