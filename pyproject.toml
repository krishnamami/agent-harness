[project]
name = "agent-harness"
version = "1.0.0"
description = "Enterprise agent harness: the fabric agents run inside. Bounded execution, a governed tool registry, tiered memory, and deterministic replay."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    # Tool arguments are validated against each tool's declared schema before
    # any policy sees them. A hand-rolled subset of JSON Schema would be the
    # wrong kind of clever: the schemas are also what model providers consume,
    # so "what the harness enforces" and "what the model was told" have to be
    # the same document under the same reading of the spec.
    "jsonschema>=4.23",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # The harness imports the *API* only: `get_tracer` is a no-op until a
    # service installs a provider. Declared explicitly rather than leaned on
    # transitively through the SDK, because that is the dependency the library
    # actually has.
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/evals", "src/harness"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "ARG", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test doubles must match the interface they stand in for, so unused
# arguments are the point rather than an oversight.
"tests/**" = ["ARG002", "ARG001"]
# Benchmark stand-ins must match the tool signature they replace, so an
# argument they ignore is the point rather than an oversight.
"benchmarks/**" = ["ARG001"]
# Reference policy implementations must match the protocol signature they
# stand in for; an argument one of them ignores is the point, not an oversight.
"src/harness/policy.py" = ["ARG002"]
"src/harness/planner.py" = ["ARG002"]
"src/harness/trace.py" = ["ARG002"]
"src/harness/gates.py" = ["ARG002"]
"src/harness/overlays.py" = ["ARG002"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --cov=app --cov=evals --cov=harness --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
